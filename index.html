<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="rps.css">

</head>

<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button" onclick="
        playGame('rock')
    "> <img src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png" class="move-icon"
            alt="Rock-Emoji">

    </button>

    <button class="move-button" onclick="
        playGame('paper')
    ">
        <img src="https://supersimple.dev/projects/rock-paper-scissors/images/paper-emoji.png" class="move-icon"
            alt="Paper-Emoji">
    </button>

    <button class="move-button" onclick="
        playGame('scissors')
    ">
        <img src="https://supersimple.dev/projects/rock-paper-scissors/images/scissors-emoji.png" class="move-icon"
            alt="Scissors-Emoji">
    </button>

    <p class="js-result"></p>
    <p class="js-moves">
        START GAME
    </p>
    <p class="js-score"></p>

    <button class="reset" onclick="
        resetGame();
    ">
        Reset Score
    </button>

    <button class="autoplay-button" onclick="
    autoPlay();
    ">
        Auto Play
    </button>
    <script src="rps.js"></script>
</body>

</html>
